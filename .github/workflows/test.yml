name: Run tests
on:
  push
jobs:

  types:

    runs-on: ubuntu-latest

    steps:

      - name: fetch code
        uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install_args: "python@3.13"

      - run: pipx install nox

      - name: run pyright in nox environment
        run: nox -s typecheck --force-color

  tests:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:

      - name: fetch code
        uses: actions/checkout@v4

      - name: install Python 3.7 on Windows
        if: matrix.os == 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: 3.7

      - uses: jdx/mise-action@v2
        if: matrix.os == 'windows-latest'
        with:
          tool_versions: |
            python 3.13 3.12 3.11 3.10 3.9 3.8

      - uses: jdx/mise-action@v2
        if: matrix.os != 'windows-latest'

      - run: pipx install nox

      - name: run ward tests in nox environment
        run: nox -s test test_without_toml combine_coverage --force-color
        env:
          PYTHONIOENCODING: utf-8

      - name: upload coverage data
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.json
          token: ${{ secrets.CODECOV_TOKEN }}
